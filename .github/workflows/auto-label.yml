name: Auto Label

# Automatically label pull requests and issues with intelligent content analysis
on:
  pull_request:
    types: [opened, reopened, edited]
  issues:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

# Prevent concurrent labeling of the same item
concurrency:
  group: auto-label-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Add intelligent labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add labels based on content
        uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const isPR = !!context.payload.pull_request;
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const labels = new Set();
            
            // Normalize text for better matching
            const title = (item.title || '').toLowerCase().trim();
            const body = (item.body || '').toLowerCase().trim();
            const combined = `${title} ${body}`;
            
            // Get existing labels to avoid duplicates
            const existingLabels = item.labels.map(l => l.name);
            
            // Documentation patterns (more comprehensive)
            const docPatterns = ['doc', 'readme', 'documentation', 'docs', 'guide', 'tutorial', 'wiki'];
            if (docPatterns.some(p => combined.includes(p))) {
              labels.add('documentation');
            }
            
            // Bug patterns (enhanced detection)
            const bugPatterns = ['bug', 'fix', 'error', 'issue', 'broken', 'crash', 'fail', 'problem', 'wrong'];
            if (bugPatterns.some(p => combined.includes(p))) {
              labels.add('bug');
            }
            
            // Enhancement patterns
            const enhancementPatterns = ['feature', 'enhancement', 'improve', 'add', 'new', 'request', 'proposal'];
            if (enhancementPatterns.some(p => combined.includes(p))) {
              labels.add('enhancement');
            }
            
            // Question patterns
            const questionPatterns = ['question', 'how to', 'help', 'what is', 'why', 'when', 'where', 'ask'];
            if (questionPatterns.some(p => combined.includes(p))) {
              labels.add('question');
            }
            
            // Security patterns
            const securityPatterns = ['security', 'vulnerability', 'cve', 'exploit', 'xss', 'injection'];
            if (securityPatterns.some(p => combined.includes(p))) {
              labels.add('security');
            }
            
            // Performance patterns
            const performancePatterns = ['performance', 'slow', 'speed', 'optimize', 'faster', 'latency'];
            if (performancePatterns.some(p => combined.includes(p))) {
              labels.add('performance');
            }
            
            // Add type label for PRs
            if (isPR) {
              labels.add('pull-request');
            }
            
            // Filter out labels that already exist
            const newLabels = Array.from(labels).filter(l => !existingLabels.includes(l));
            
            if (newLabels.length > 0) {
              const number = isPR ? context.payload.pull_request.number : context.payload.issue.number;
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  labels: newLabels
                });
                core.info(`✅ Added labels: ${newLabels.join(', ')}`);
              } catch (error) {
                core.warning(`Failed to add labels: ${error.message}`);
                // Don't fail the workflow if labeling fails
              }
            } else {
              core.info('ℹ️ No new labels to add (all matching labels already present or no patterns matched)');
            }
