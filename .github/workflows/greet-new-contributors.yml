name: Greet New Contributors

# Welcome new contributors with a friendly message
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet new contributor
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const isFirstContribution = issue.author_association === 'FIRST_TIME_CONTRIBUTOR';
            
            if (!isFirstContribution) {
              console.log('Not a first-time contributor');
              return;
            }
            
            const isPR = !!context.payload.pull_request;
            const greeting = isPR
              ? `👋 Thanks for opening your first pull request! We're excited to have you as a contributor. Someone will review your PR soon.`
              : `👋 Thanks for opening your first issue! We appreciate your contribution to this learning project. Someone will respond to your issue soon.`;
            
            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: greeting
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: greeting
              });
            }
