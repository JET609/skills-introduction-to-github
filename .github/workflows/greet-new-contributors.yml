name: Greet New Contributors

# Welcome new contributors with a friendly, personalized message
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

# Prevent duplicate greetings
concurrency:
  group: greet-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  greet:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Greet new contributor
        uses: actions/github-script@v7
        with:
          retries: 2
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const isPR = !!context.payload.pull_request;
            const number = isPR ? context.payload.pull_request.number : context.payload.issue.number;
            
            // Check if this is truly a first-time contributor
            const isFirstContribution = issue.author_association === 'FIRST_TIME_CONTRIBUTOR';
            
            if (!isFirstContribution) {
              core.info(`User ${issue.user.login} is not a first-time contributor (${issue.author_association})`);
              return;
            }
            
            // Check if we've already greeted this user on this item
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 10
              });
              
              const alreadyGreeted = comments.some(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('first') &&
                comment.body.includes('👋')
              );
              
              if (alreadyGreeted) {
                core.info('Already greeted this contributor');
                return;
              }
            } catch (error) {
              core.warning(`Could not check existing comments: ${error.message}`);
              // Continue anyway to ensure greeting is posted
            }
            
            // Create personalized greeting based on type
            const greeting = isPR
              ? `👋 **Welcome, @${issue.user.login}!**\n\nThank you for opening your first pull request in this repository! 🎉\n\nWe're excited to have you as a contributor. A maintainer will review your PR soon.\n\n**First-time contributor tips:**\n- Make sure your PR description clearly explains the changes\n- Be responsive to review feedback\n- Feel free to ask questions if anything is unclear\n\nHappy coding! 🚀`
              : `👋 **Welcome, @${issue.user.login}!**\n\nThank you for opening your first issue! We appreciate your contribution to this project. 🎉\n\nA maintainer will respond soon. In the meantime:\n- Make sure your issue description is clear and complete\n- Include any relevant error messages or screenshots\n- Check if similar issues already exist\n\nThanks for helping improve this project! 💪`;
            
            // Post the greeting
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: greeting
              });
              core.info(`✅ Greeted first-time contributor @${issue.user.login} on ${isPR ? 'PR' : 'issue'} #${number}`);
            } catch (error) {
              core.error(`Failed to post greeting: ${error.message}`);
              throw error;
            }
