name: Stale Issues and PRs

# Mark stale issues and pull requests
on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had any activity for 60 days. 
            It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions! 🙏
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,help-wanted'
          # PR settings
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had any activity for 30 days.
            It will be closed in 14 days if no further activity occurs.
            Thank you for your contributions! 🙏
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security'
          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
