name: Auto Delete Branch

# Automatically delete head branches after pull requests are merged
on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

# Prevent concurrent executions
concurrency:
  group: delete-branch-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  delete-branch:
    name: Delete merged branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 404,422
          script: |
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Protected branches that should never be deleted
            const protectedBranches = ['main', 'master', 'develop', 'production'];
            
            if (protectedBranches.includes(branch.toLowerCase())) {
              core.info(`⛔ Skipping deletion of protected branch: ${branch}`);
              return;
            }
            
            // Check if branch still exists before attempting deletion
            try {
              await github.rest.git.getRef({
                owner: owner,
                repo: repo,
                ref: `heads/${branch}`
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`✓ Branch ${branch} already deleted`);
                return;
              }
              throw error;
            }
            
            // Delete the branch
            try {
              await github.rest.git.deleteRef({
                owner: owner,
                repo: repo,
                ref: `heads/${branch}`
              });
              core.info(`✅ Successfully deleted branch: ${branch}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning(`Branch ${branch} cannot be deleted (may be protected)`);
              } else if (error.status === 404) {
                core.info(`Branch ${branch} was already deleted`);
              } else {
                core.error(`Failed to delete branch ${branch}: ${error.message}`);
                throw error;
              }
            }
